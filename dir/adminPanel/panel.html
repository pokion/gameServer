<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Panel</title>
    <link rel='stylesheet' href='/static/bootstrap.min.css'>
</head>
<body>
    
    <div class="container-fluid min-vh-100">
        <div class="row">
            <div class="col-2">panel mały</div>
            <div class="col-10 border border-top-0 border-end-0 border-start-0">panel duży</div>
        </div>
        <div class="row">
            <div class="col-2 border border-top-0 border-bottom-0 border-start-0">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><a onclick="toggleView('account')">Accounts</a></li>
                    <li class="list-group-item"><a onclick="toggleView('avatar')">Avatars</a></li>
                    <li class="list-group-item"><a onclick="toggleView('item')">Items</a></li>
                    <li class="list-group-item"><a onclick="toggleView('enemy')">Enemies</a></li>
                    <li class="list-group-item"><a>Places?</a></li>
                </ul>
            </div>
            <div class="col-10">
                <!-- account -->
                <div class="row p-4" id="account">
                    <div class="card mb-4">
                        <div class="card-body row">
                            <div class="col">
                                <label for="accountName" class="form-label">Name</label>
                                <input type="text" class="form-control" id="accountName" placeholder="Name">
                            </div>
                            <div class="col">
                                <label for="accountPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="accountPassword" placeholder="Password">
                            </div>
                            <div class="col">
                                <label for="accountEmail" class="form-label w-100">
                                    Email
                                </label>
                                <input type="email" class="form-control" id="accountEmail" placeholder="example@xy.z">
                            </div>
                            <div class="col text-center">
                                <button type="button" class="btn btn-primary btn-lg" onclick="addData('account')">Create</button>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-body row">
                            <div class="col">
                                <label for="accountNameSearch" class="form-label">Name</label>
                                <input type="text" class="form-control" id="accountNameSearch" placeholder="Name">
                            </div>
                            <div class="col">
                                <label for="accountEmailSearch" class="form-label w-100">
                                    Email
                                    <span class="float-end">
                                        <input class="form-check-input" type="checkbox" value="" id="accountIsValidSearch">
                                        <label class="form-check-label" for="accountIsValidSearch">
                                            Is email valid
                                        </label>
                                    </span>
                                </label>
                                <input type="email" class="form-control" id="accountEmailSearch" placeholder="example@xy.z">
                            </div>
                            <div class="col">
                                <button type="button" class="btn btn-primary btn-lg" onclick="loadData('account')">Search</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive" style="max-height: 500px;">
                                <table class="table table-bordered">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Name</th>
                                            <th>Email</th>
                                            <th>IsValid</th>
                                        </tr>
                                    </thead>
                                    <tbody id="accountBody">
                                        <!-- 
                                            <tr>
                                                <th>${row.ID}</th>
                                                <td>${row.name}</td>
                                                <td>${row.email}</td>
                                                <td><input class="form-check-input" type="checkbox" ${(row.isValid) ? 'checked' : ''} disabled></td>
                                            </tr>
                                        -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- end account -->
                <!-- avatars -->
                <div class="row p-4 d-none" id="avatar">
                    <div class="card mb-4">
                        <div class="card-body row">
                            <div class="col">
                                <div class="row">
                                    <input type="number" class="form-control" id="avatarAccountID" placeholder="AccountID">
                                </div>
                                <div class="row">
                                    <input type="text" class="form-control" id="avatarName" placeholder="Name">
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <select id="avatarClass" class="form-select form-select-sm" aria-label="Small select example">
                                        <option selected value="">Select class</option>
                                        <option value="wojownik">Wojownik</option>
                                        <option value="mag">Mag</option>
                                        <option value="palladyn">Palladyn</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <input type="number" class="form-control" id="avatarHitPoints" placeholder="Hit points">
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <input type="number" class="form-control" id="avatarIntelligence" placeholder="Intelligence">
                                </div>
                                <div class="row">
                                    <input type="number" class="form-control" id="avatarDexterity" placeholder="Dexterity">
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <input type="number" class="form-control" id="avatarStrenght" placeholder="Strenght">
                                </div>
                                <div class="row">
                                    <input type="number" class="form-control" id="avatarLuck" placeholder="Luck">
                                </div>
                            </div>
                            <div class="col text-center">
                                <button type="button" class="btn btn-primary btn-lg" onclick="addData('avatar')">Create</button>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-body row">
                            <div class="col">
                                <label for="avatarAccountIDSearch" class="form-label">Account ID</label>
                                <input type="number" class="form-control" id="avatarAccountIDSearch" placeholder="AccountID">
                            </div>
                            <div class="col">
                                <label for="avatarNameSearch" class="form-label">Name</label>
                                <input type="text" class="form-control" id="avatarNameSearch" placeholder="Name">
                            </div>
                            <div class="col">
                                <label for="avatarClassSearch" class="form-label w-100">Class</label>
                                <select id="avatarClassSearch" class="form-select form-select-sm" aria-label="Small select example">
                                    <option selected value="">Select class</option>
                                    <option value="wojownik">Wojownik</option>
                                    <option value="mag">Mag</option>
                                    <option value="palladyn">Palladyn</option>
                                </select>
                            </div>
                            <div class="col">
                                <button type="button" class="btn btn-primary btn-lg">Search</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive" style="max-height: 500px;">
                                <table class="table table-bordered">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Name</th>
                                            <th>AccountID</th>
                                            <th>Class</th>
                                            <th>Hit points</th>
                                            <th>Intelligence</th>
                                            <th>Dexterity</th>
                                            <th>Strenght</th>
                                            <th>Luck</th>
                                        </tr>
                                    </thead>
                                    <tbody id="avatarBody">
                                       <!-- <tr>
                                            <td>1</td>
                                            <td>Arthor</td>
                                            <td>1001</td>
                                            <td>Warrior</td>
                                            <td>180</td>
                                            <td>25</td>
                                            <td>40</td>
                                            <td>55</td>
                                            <td>18</td>
                                        </tr> -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- avatars end -->
                <!-- items -->
                 <div class="row p-4 d-none" id="item">
                    <div class="card mb-4">
                        <div class="card-body row">
                            <div class="col">
                                <div class="row">
                                    <label for="itemName" class="form-label">Name</label>
                                    <input type="text" class="form-control" id="itemName" placeholder="Name">
                                </div>
                                <div class="row">
                                    <label for="itemHitPoints" class="form-label">Hit points</label>
                                    <input type="number" class="form-control" id="itemHitPoints" placeholder="Hit points">
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <label for="itemDefense" class="form-label">Defense</label>
                                    <input type="number" class="form-control" id="itemDefense" placeholder="Defense">
                                </div>
                                <div class="row">
                                    <label for="itemAttack" class="form-label">Attack</label>
                                    <input type="number" class="form-control" id="itemAttack" placeholder="Attack">
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <div class="col">
                                        <label for="itemClass" class="form-label w-100">Class</label>
                                        <select id="itemClass" class="form-select form-select-sm" aria-label="Small select example">
                                            <option selected value="">Select class</option>
                                            <option value="wojownik">Wojownik</option>
                                            <option value="mag">Mag</option>
                                            <option value="palladyn">Palladyn</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <label for="itemLevel" class="form-label">Level</label>
                                    <input type="number" class="form-control" id="itemLevel" placeholder="Level">
                                </div>
                            </div>
                            <div class="col text-center">
                                <button type="button" class="btn btn-primary btn-lg" onclick="addData('item')">Create</button>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-body row">
                            <div class="col">
                                <label for="itemNameSearch" class="form-label">Name</label>
                                <input type="text" class="form-control" id="itemNameSearch" placeholder="Name">
                            </div>
                            <div class="col">
                                <label for="itemClassSearch" class="form-label w-100">Class</label>
                                <select id="itemClassSearch" class="form-select form-select-sm" aria-label="Small select example">
                                    <option selected value="">Select class</option>
                                    <option value="wojownik">Wojownik</option>
                                    <option value="mag">Mag</option>
                                    <option value="palladyn">Palladyn</option>
                                </select>
                            </div>
                            <div class="col">
                                <button type="button" class="btn btn-primary btn-lg" onclick="loadData('item')">Search</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive" style="max-height: 500px;">
                                <table class="table table-bordered">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Name</th>
                                            <th>Defense</th>
                                            <th>Hit points</th>
                                            <th>Attack</th>
                                            <th>Level</th>
                                            <th>Class</th>
                                        </tr>
                                    </thead>
                                    <tbody id="itemBody">
                                        <!-- <tr>
                                            <td>1</td>
                                            <td>Iron Sword</td>
                                            <td>0</td>
                                            <td>0</td>
                                            <td>25</td>
                                            <td>5</td>
                                        </tr> -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- items end -->
                <!-- enemies -->
                 <div class="row p-4 d-none" id="enemy">
                    <div class="card mb-4">
                        <div class="card-body row">
                            <div class="col">
                                <div class="row">
                                    <input type="text" class="form-control" id="enemyName" placeholder="Name">
                                </div>
                                <div class="row">
                                    <input type="text" class="form-control" id="enemyHitPoints" placeholder="Hit points">
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <input type="number" class="form-control" id="enemyIntelligence" placeholder="Intelligence">
                                </div>
                                <div class="row">
                                    <input type="number" class="form-control" id="enemyDexterity" placeholder="Dexterity">
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <input type="number" class="form-control" id="enemyStrength" placeholder="Strength">
                                </div>
                                <div class="row">
                                    <input type="number" class="form-control" id="enemyLevel" placeholder="level">
                                </div>
                            </div>
                            <div class="col">
                                <div class="row">
                                    <input type="number" class="form-control" id="enemyExperience" placeholder="Experience">
                                </div>
                                <div class="row">
                                    <input type="number" class="form-control" id="enemyDefense" placeholder="Defense">
                                </div>
                            </div>
                            <div class="col text-center">
                                <button type="button" class="btn btn-primary btn-lg" onclick="addData('enemy')">Create</button>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-body row">
                            <div class="col">
                                <label for="enemyNameSearch" class="form-label">Name</label>
                                <input type="text" class="form-control" id="enemyNameSearch" placeholder="Name">
                            </div>
                            <div class="col">
                                <button type="button" class="btn btn-primary btn-lg" onclick="loadData('enemy')">Search</button>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive" style="max-height: 500px;">
                                <table class="table table-bordered">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Name</th>
                                            <th>Hit points</th>
                                            <th>Intelligence</th>
                                            <th>Dexterity</th>
                                            <th>Strength</th>
                                            <th>Level</th>
                                            <th>Experience</th>
                                            <th>Defense</th>
                                        </tr>
                                    </thead>
                                    <tbody id="enemyBody">
                                        <!-- <tr>
                                            <td>1</td>
                                            <td>Goblin</td>
                                            <td>45</td>
                                            <td>12</td>
                                            <td>18</td>
                                            <td>15</td>
                                            <td>1</td>
                                            <td>20</td>
                                            <td>5</td>
                                        </tr> -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- enemies end -->
                <!-- places -->

                <!-- places end -->
            </div>
        </div>
    </div>
    <script src="/static/bootstrap.min.js"></script>
    <script src="/static/panelUI.js"></script>
</body>
</html>
